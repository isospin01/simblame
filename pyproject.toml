[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "simblame"
version = "0.2.0"
description = "git blame for simulated physics: find which simulation change made your robot policy's success rate move."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "simblame contributors" }]
keywords = ["mujoco", "robotics", "reinforcement-learning", "imitation-learning", "regression-testing", "simulation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "numpy>=1.21",
  "mujoco>=2.3.3",
]

[project.optional-dependencies]
gym = ["gymnasium[mujoco]>=1.0", "stable-baselines3>=2.0", "huggingface_hub"]
libero = ["hf-libero"]
metaworld = ["metaworld>=3.0", "packaging"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
simblame = "simblame.cli:main"

[project.urls]
Homepage = "https://github.com/isospin01/simblame"
Issues = "https://github.com/isospin01/simblame/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simblame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs network / creates virtualenvs (deselect with -m 'not slow')",
  "metaworld: needs the metaworld package",
]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP006", "UP035", "B905"]
